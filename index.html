<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة شاورمات (Shawermat.co) - المنيو الإلكتروني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --tomato: #E34234;
            --tomato-dark: #C7352B;
            --lavender: #C8B3E8;
            --chartreuse: #D4FF3F;
            --primary: var(--tomato);
            --primary-dark: var(--tomato-dark);
            --bg-dark: #17131D;
            --bg-card: #211A29;
            --bg-control: #2A2134;
            --text-main: #FAF7FF;
            --text-muted: var(--lavender);
            --accent: var(--chartreuse);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: radial-gradient(ellipse at top, #30223D 0, var(--bg-dark) 48%);
            color: var(--text-main); overflow-x: hidden; min-height: 100vh;
        }

        #branch-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(23,19,29,0.94); z-index: 3000; display: flex;
            justify-content: center; align-items: center; padding: 20px;
        }

        .branch-card {
            background: var(--bg-card); border: 2px solid var(--primary);
            border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; text-align: center;
        }

        .branch-btn {
            background: var(--primary); color: white; border: none; width: 100%;
            padding: 12px; border-radius: 10px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; margin-top: 15px; transition: 0.3s;
        }

        header {
            background: linear-gradient(135deg, var(--bg-card), #34223C);
            padding: 20px; text-align: center; border-bottom: 3px solid var(--lavender);
        }

        .logo-container h1 { color: var(--primary); font-size: 1.8rem; font-weight: 900; }
        .branch-indicator {
            display: inline-block; background: rgba(212,255,63,0.12); color: var(--accent);
            padding: 4px 12px; border-radius: 15px; font-size: 0.85rem; margin-top: 8px;
            border: 1px solid var(--accent);
        }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .section-title {
            font-size: 1.4rem; margin: 25px 0 15px; border-right: 4px solid var(--primary);
            padding-right: 10px; color: var(--accent);
        }

        .menu-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;
        }

        .menu-card {
            background: var(--bg-card); border-radius: 16px; overflow: hidden;
            border: 1px solid rgba(200,179,232,0.22); display: flex; flex-direction: column;
            justify-content: space-between; transition: 0.3s;
        }

        .menu-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .card-img-container {
            height: 190px; background: var(--bg-control); position: relative; overflow: hidden;
        }
        .card-img-container img {
            position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px);
            object-fit: contain; object-position: center;
        }
        
        .calories-badge {
            position: absolute; top: 10px; left: 10px; background: rgba(23,19,29,0.82);
            color: var(--accent); padding: 4px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 700;
        }

        .card-content { padding: 15px; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }

        .options-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .option-label {
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; min-width: 0; background: rgba(200,179,232,0.09);
            padding: 9px 12px; border-radius: 8px; cursor: pointer;
        }
        .option-label > div { min-width: 0; }
        .option-label input[type="radio"] { flex: 0 0 auto; accent-color: var(--primary); }
        .option-label .price { flex: 0 0 auto; white-space: nowrap; }
        .price { color: var(--accent); font-weight: 700; }

        .quantity-control {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; background: rgba(200,179,232,0.06); padding: 5px 10px; border-radius: 8px;
        }
        .qty-btn { background: var(--bg-control); color: var(--lavender); border: 1px solid rgba(200,179,232,0.2); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; }
        .qty-input { width: 40px; text-align: center; background: none; border: none; color: white; font-weight: 700; }

        .add-to-cart-btn {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .add-to-cart-btn:hover { background: var(--primary-dark); }

        .cart-floating {
            position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 20px; background: var(--primary); color: white;
            padding: 12px 20px; border-radius: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            cursor: pointer; z-index: 999; display: flex; align-items: center; gap: 10px; font-weight: 700;
        }

        .cart-feedback {
            display: none; position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: min(440px, calc(100% - 32px)); align-items: center; justify-content: space-between;
            gap: 12px; padding: 14px 16px; background: var(--lavender); border: 1px solid var(--chartreuse);
            border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 1001;
        }
        .cart-feedback.is-visible { display: flex; }
        .cart-feedback-message { color: var(--bg-dark); font-weight: 700; }
        .cart-feedback-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .cart-feedback-view {
            background: var(--tomato); color: #fff; border: none; border-radius: 8px;
            padding: 8px 12px; font-weight: 700; cursor: pointer;
        }
        .cart-feedback-close { background: none; color: var(--bg-dark); border: none; font-size: 1.3rem; cursor: pointer; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(23,19,29,0.86); z-index: 2000; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: var(--bg-card); width: 100%; max-width: 500px; border-radius: 20px;
            padding: 20px; border: 2px solid var(--primary); max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(200,179,232,0.2); padding-bottom: 10px; margin-bottom: 15px; }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(200,179,232,0.12); }
        .cart-fee-row { display: flex; justify-content: space-between; color: var(--text-muted); margin-bottom: 10px; }
        .cart-fee-row[hidden], #delivery-address-group[hidden] { display: none; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-muted); }
        .form-control { width: 100%; padding: 10px; background: var(--bg-control); border: 1px solid rgba(200,179,232,0.25); border-radius: 8px; color: var(--text-main); }
        .checkout-btn {
            width: 100%; background: var(--tomato); color: white; border: none; padding: 12px;
            border-radius: 10px; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 15px;
        }

        .notes-section {
            background: var(--bg-card); border-radius: 12px; padding: 15px; margin-top: 30px;
            border: 1px dashed var(--primary); font-size: 0.85rem; color: var(--text-muted); line-height: 1.6;
        }
        .notes-section h4 { color: var(--accent); margin-bottom: 5px; }
        .footer-contact { text-align: center; padding: 20px; margin-top: 20px; font-size: 1.2rem; color: var(--lavender); font-weight: 700; background: var(--bg-card); border-top: 1px solid rgba(200,179,232,0.2); }

        .category-nav {
            display: flex; gap: 12px; overflow-x: auto; overscroll-behavior-inline: contain;
            padding: 12px 2px 18px; margin-bottom: 8px; scroll-behavior: smooth;
            scroll-snap-type: inline mandatory; scrollbar-width: thin; -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y;
        }
        .category-shortcut {
            flex: 0 0 92px; min-height: 104px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px; padding: 10px 6px;
            color: var(--text-muted); background: var(--bg-card); border: 1px solid rgba(200,179,232,0.24);
            border-radius: 18px; cursor: pointer; scroll-snap-align: start; transition: 0.2s;
        }
        .category-shortcut:hover, .category-shortcut:focus-visible, .category-shortcut.is-active {
            color: var(--text-main); border-color: var(--primary); background: rgba(227,66,52,0.13);
        }
        .category-shortcut-icon {
            width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%;
            color: var(--accent); background: rgba(212,255,63,0.1);
            border: 1px solid rgba(212,255,63,0.35); font-size: 1.15rem;
        }
        .category-shortcut-label { max-width: 100%; font-size: 0.78rem; font-weight: 700; line-height: 1.35; }
        .customer-menu-toolbar {
            position: sticky; top: 0; z-index: 1000; padding: 8px 0 2px;
            background: rgba(23,19,29,0.97); border-bottom: 1px solid rgba(200,179,232,0.18);
            box-shadow: 0 8px 18px rgba(0,0,0,0.22); backdrop-filter: blur(12px);
        }
        .customer-category { scroll-margin-top: 175px; }
        .empty-category, .management-empty { color: var(--text-muted); padding: 12px 4px; }
        .customer-offers { margin-bottom: 20px; }
        .customer-offers[hidden] { display: none; }
        .offer-ticker {
            display: flex; align-items: center; gap: 12px; min-width: 0; overflow: hidden;
            padding: 11px 14px; border: 1px solid rgba(227,66,52,0.5); border-radius: 14px;
            background: linear-gradient(110deg, rgba(227,66,52,0.2), var(--bg-card) 68%);
        }
        .offer-ticker-label {
            flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px;
            color: var(--accent); font-weight: 900;
        }
        .offer-ticker-viewport { flex: 1 1 auto; min-width: 0; overflow: hidden; direction: ltr; }
        .offer-ticker-track {
            display: flex; width: max-content; will-change: transform;
            animation: offer-ticker-move 28s linear infinite;
        }
        .offer-ticker:hover .offer-ticker-track,
        .offer-ticker:focus-within .offer-ticker-track { animation-play-state: paused; }
        .offer-ticker-group { display: flex; flex: 0 0 auto; align-items: center; gap: 28px; padding-inline: 14px; }
        .offer-ticker-item {
            display: inline-flex; flex: 0 0 auto; align-items: center; gap: 8px;
            direction: rtl; color: var(--text-main); white-space: nowrap;
        }
        .offer-ticker-item strong { color: var(--accent); }
        .offer-ticker-item span { color: var(--text-muted); font-size: 0.9rem; }
        .offer-ticker-separator { color: var(--primary); }
        @keyframes offer-ticker-move {
            from { transform: translateX(-50%); }
            to { transform: translateX(0); }
        }
        .offer-description, .offer-expiry { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; overflow-wrap: anywhere; }
        .offer-price { display: inline-block; color: white; font-weight: 700; margin-top: 7px; }
        .offer-admin-list { display: grid; gap: 12px; }
        .offer-admin-card, .category-admin-row {
            min-width: 0; padding: 14px; border-radius: 12px; background: var(--bg-control);
        }
        .offer-admin-card h4 { color: var(--accent); overflow-wrap: anywhere; }
        .offer-admin-card p { color: var(--text-muted); margin: 4px 0; overflow-wrap: anywhere; }
        .offer-admin-actions { display: flex; gap: 8px; margin-top: 10px; }
        .category-admin-list { display: grid; gap: 9px; }
        .category-admin-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .category-admin-label { min-width: 0; overflow-wrap: anywhere; }
        .category-admin-label i { color: var(--accent); margin-left: 7px; }
        .management-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
        .management-card { min-width: 0; padding: 18px; border: 1px solid rgba(200,179,232,0.22); border-radius: 14px; background: var(--bg-card); }
        .management-card h3 { margin-bottom: 14px; color: var(--accent); }
        .management-form { display: grid; gap: 8px; }
        .offer-database-status { color: #ff9a91; margin-bottom: 12px; }
        .offer-database-status[hidden] { display: none; }
        .offer-branches-select { min-height: 100px; }
        .offer-active-field { display: flex; align-items: center; gap: 9px; color: var(--text-muted); margin-bottom: 14px; }
        .offer-active-field input { width: 18px; height: 18px; accent-color: var(--primary); }
        .offer-status { font-weight: 700; }
        .offer-status.is-expired { color: #ff9a91; }
        .offer-status.is-active { color: var(--accent); }

        #admin-wrapper { display: none; }
        .admin-page-body { padding: 20px; margin-right: 260px; min-height: 100vh; }
        .admin-sidebar {
            position: fixed; inset: 0 0 0 auto; width: 240px; padding: 24px 16px;
            background: var(--bg-card); border-left: 1px solid rgba(200,179,232,0.2); z-index: 1100;
            display: flex; flex-direction: column; gap: 24px;
        }
        .sidebar-brand { padding: 6px 12px 18px; border-bottom: 1px solid rgba(200,179,232,0.2); }
        .sidebar-brand h2 { color: var(--primary); font-size: 1.35rem; font-weight: 900; }
        .sidebar-brand p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
        .sidebar-nav { display: grid; gap: 8px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 12px; padding: 11px 13px;
            border-radius: 9px; color: var(--text-muted); text-decoration: none; transition: 0.2s; cursor: pointer;
        }
        .sidebar-link i { width: 20px; text-align: center; }
        .sidebar-link:hover, .sidebar-link.is-active { color: var(--text-main); background: rgba(200,179,232,0.12); }
        .sidebar-link.is-active { border-right: 3px solid var(--primary); }
        .sidebar-back-link { margin-top: auto; color: var(--accent); text-decoration: none; padding: 10px 12px; cursor: pointer; }
        .sidebar-toggle, .sidebar-overlay { display: none; }
        .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border-right: 4px solid var(--primary); text-align: center; }
        .stat-card h3 { font-size: 1.8rem; color: var(--accent); }
        .sales-chart-card { min-width: 0; background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid rgba(200,179,232,0.2); }
        .chart-controls { display: flex; gap: 10px; margin: 15px 0; }
        .chart-controls .form-control { flex: 1; min-width: 0; }
        .chart-canvas-wrap { position: relative; width: 100%; height: 300px; }
        #sales-chart { display: block; width: 100%; height: 100%; }
        .chart-summary, .chart-note { color: var(--text-muted); font-size: 0.9rem; margin-top: 10px; }
        .chart-summary { color: var(--accent); font-weight: 700; }
        .admin-view { display: none; }
        .admin-view.is-active { display: block; }
        .orders-search { max-width: 420px; margin: 0 0 15px; }
        .orders-search label { display: block; margin-bottom: 6px; color: var(--text-muted); }
        
        table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 10px; overflow: hidden; margin-top: 15px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid rgba(200,179,232,0.16); font-size: 0.9rem; }
        th { background: var(--bg-control); color: var(--lavender); }
        .admin-form { background: var(--bg-card); padding: 20px; border-radius: 12px; margin-top: 25px; border: 1px solid var(--primary); }
        .image-hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; }
        .items-table-wrap { overflow-x: auto; }
        .item-actions { display: flex; gap: 8px; }
        .item-action-btn { border: 0; border-radius: 7px; padding: 7px 10px; color: white; cursor: pointer; white-space: nowrap; }
        .item-edit-btn { background: var(--lavender); color: var(--bg-dark); }
        .item-delete-btn { background: var(--tomato); }

            width: min(520px, calc(100% - 24px)); max-height: 90vh; overflow-
